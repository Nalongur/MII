syntax = "proto3";

package mii.protocol.v1;

option java_package = "com.mii.protocol.v1";
option java_multiple_files = true;
option java_outer_classname = "MiiProtocol";

// The independently versioned MII wire protocol.
//
// Compatibility rule for v1:
// - new fields may be appended with new field numbers;
// - an existing field number or meaning must never be reused;
// - an incompatible change requires a new major version and migration path.
message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
}

enum PayloadType {
  PAYLOAD_TYPE_UNSPECIFIED = 0;
  PAYLOAD_TYPE_DEVICE_STATUS_REQUEST = 1;
}

// Common transport-independent wrapper for BLE, Wi-Fi and test fixtures.
//
// message_id is chosen by the sender and must be reused when the same logical
// request is retried. sequence_number is monotonically increasing in the
// sender's current authenticated session. sent_at_unix_ms may be zero when a
// sender has no trusted wall clock.
message Envelope {
  ProtocolVersion protocol_version = 1;
  uint64 message_id = 2;
  string device_id = 3;
  uint64 sequence_number = 4;
  int64 sent_at_unix_ms = 5;
  PayloadType payload_type = 6;
  bytes payload = 7;
}

// First control-plane request used to prove cross-language code generation
// and deterministic serialization before the complete status model is added.
message DeviceStatusRequest {
  bool include_runtime_counters = 1;
}

// Separate authentication control format. Existing Envelope fields/vectors
// remain unchanged. Version 1 rejects non-canonical outer packets; extensions
// require explicit negotiation rather than silently skipping security fields.
message BindingProposal {
  bytes owner_id = 1;             // exactly 16 bytes
  bytes owner_key = 2;            // exactly 32 bytes; authenticated SC link only
  bytes https_token = 3;          // exactly 32 bytes, independently random
  bytes certificate_sha256 = 4;  // exactly 32 bytes
}
message BindingAccepted {
  bytes owner_id = 1;
  uint64 binding_generation = 2;
}
message SessionHello {
  bytes owner_id = 1;
  bytes client_nonce = 2;
}
message SessionChallenge {
  bytes device_nonce = 1;
  bytes device_proof = 2;
  uint64 binding_generation = 3;
}
message SessionProof { bytes client_proof = 1; }
message SessionReady {
  bytes session_id = 1;
  uint64 binding_generation = 2;
}
message AuthenticatedEnvelope {
  bytes session_id = 1;
  // MAC covers these EXACT bytes, before any parsing or reserialization.
  // 512-byte bound reserves room for wrapper/session ID/MAC inside a 604 B frame.
  bytes canonical_envelope = 2;
  bytes authentication_tag = 3;
}
enum AuthenticationFailureCode {
  AUTHENTICATION_FAILURE_UNSPECIFIED = 0;
  AUTHENTICATION_FAILURE_REJECTED = 1;
  AUTHENTICATION_FAILURE_RETRY_LATER = 2;
  AUTHENTICATION_FAILURE_STORAGE_UNAVAILABLE = 3;
}
message AuthenticationFailure { AuthenticationFailureCode code = 1; }
message AuthenticationPacket {
  uint32 authentication_version = 1; // exactly 1
  uint64 request_id = 2;             // nonzero correlation, not business ACK
  oneof body {
    BindingProposal binding_proposal = 10;
    BindingAccepted binding_accepted = 11;
    SessionHello session_hello = 12;
    SessionChallenge session_challenge = 13;
    SessionProof session_proof = 14;
    SessionReady session_ready = 15;
    AuthenticatedEnvelope authenticated_envelope = 16;
    AuthenticationFailure failure = 17;
  }
}
