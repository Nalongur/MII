<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#172033}
      .title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#526078}.label{font-size:18px;font-weight:700}
      .small{font-size:15px}.tiny{font-size:13px}.box{fill:#fff;stroke:#26364d;stroke-width:2}
      .ic{fill:#edf4ff;stroke:#305d9c;stroke-width:2.5}.note{fill:#fff7df;stroke:#d69a26;stroke-width:2}
      .pwr{stroke:#d13b3b;stroke-width:3;fill:none}.sig{stroke:#2767b1;stroke-width:2.4;fill:none}
      .ctl{stroke:#16856b;stroke-width:2.4;fill:none}.gnd{stroke:#222;stroke-width:2.2;fill:none}.dash{stroke-dasharray:8 6}
      .net{font-size:14px;font-weight:700;fill:#185899}.pin{font-size:14px}.head{font-size:16px;font-weight:700;fill:#305d9c}
    </style>
  </defs>
  <rect width="1800" height="1120" fill="#fcfdff"/>
  <text x="55" y="58" class="title">02｜ESP32-S3-MINI-1-N8、按键与调试接口</text>
  <text x="55" y="88" class="sub">原生USB下载｜三个侧按键｜软关机保持｜关键恢复测试点</text>

  <!-- ESP module -->
  <rect x="620" y="145" width="560" height="760" rx="14" class="ic"/>
  <text x="900" y="188" text-anchor="middle" class="label">U1 ESP32-S3-MINI-1-N8</text>
  <rect x="770" y="205" width="260" height="90" rx="8" fill="#dbe3f1" stroke="#53657e" stroke-width="2"/>
  <text x="900" y="242" text-anchor="middle" class="small">PCB天线区</text>
  <text x="900" y="268" text-anchor="middle" class="tiny">板边伸出／所有层禁布铜／下方无电池和金属</text>

  <!-- left pins -->
  <text x="645" y="340" class="pin">3V3</text><line x1="575" y1="335" x2="620" y2="335" class="pwr"/>
  <text x="645" y="382" class="pin">EN</text><line x1="530" y1="377" x2="620" y2="377" class="ctl"/>
  <text x="645" y="424" class="pin">GPIO0</text><line x1="500" y1="419" x2="620" y2="419" class="ctl"/>
  <text x="645" y="466" class="pin">GPIO1</text><line x1="500" y1="461" x2="620" y2="461" class="ctl"/>
  <text x="645" y="508" class="pin">GPIO2</text><line x1="500" y1="503" x2="620" y2="503" class="ctl"/>
  <text x="645" y="550" class="pin">GPIO4</text><line x1="500" y1="545" x2="620" y2="545" class="sig"/>
  <text x="645" y="592" class="pin">GPIO5</text><line x1="500" y1="587" x2="620" y2="587" class="sig"/>
  <text x="645" y="634" class="pin">GPIO6</text><line x1="500" y1="629" x2="620" y2="629" class="sig"/>
  <text x="645" y="676" class="pin">GPIO7</text><line x1="500" y1="671" x2="620" y2="671" class="sig"/>
  <text x="645" y="718" class="pin">GPIO8</text><line x1="500" y1="713" x2="620" y2="713" class="sig"/>
  <text x="645" y="760" class="pin">GPIO9</text><line x1="500" y1="755" x2="620" y2="755" class="sig"/>
  <text x="645" y="802" class="pin">GPIO10</text><line x1="500" y1="797" x2="620" y2="797" class="sig"/>
  <text x="645" y="844" class="pin">GPIO11</text><line x1="500" y1="839" x2="620" y2="839" class="sig"/>
  <text x="645" y="886" class="pin">GPIO12</text><line x1="500" y1="881" x2="620" y2="881" class="sig"/>

  <!-- right pins -->
  <text x="1155" y="340" text-anchor="end" class="pin">GPIO13</text><line x1="1180" y1="335" x2="1270" y2="335" class="ctl"/><text x="1280" y="341" class="net">CHG</text>
  <text x="1155" y="382" text-anchor="end" class="pin">GPIO14</text><line x1="1180" y1="377" x2="1270" y2="377" class="ctl"/><text x="1280" y="383" class="net">PWR_INT</text>
  <text x="1155" y="424" text-anchor="end" class="pin">GPIO15</text><line x1="1180" y1="419" x2="1270" y2="419" class="ctl"/><text x="1280" y="425" class="net">GNSS_EN</text>
  <text x="1155" y="466" text-anchor="end" class="pin">GPIO16</text><line x1="1180" y1="461" x2="1270" y2="461" class="sig"/><text x="1280" y="467" class="net">1PPS</text>
  <text x="1155" y="508" text-anchor="end" class="pin">GPIO17</text><line x1="1180" y1="503" x2="1270" y2="503" class="sig"/><text x="1280" y="509" class="net">GNSS_RX</text>
  <text x="1155" y="550" text-anchor="end" class="pin">GPIO18</text><line x1="1180" y1="545" x2="1270" y2="545" class="sig"/><text x="1280" y="551" class="net">GNSS_TX</text>
  <text x="1155" y="592" text-anchor="end" class="pin">GPIO19</text><line x1="1180" y1="587" x2="1270" y2="587" class="sig"/><text x="1280" y="593" class="net">USB_DM</text>
  <text x="1155" y="634" text-anchor="end" class="pin">GPIO20</text><line x1="1180" y1="629" x2="1270" y2="629" class="sig"/><text x="1280" y="635" class="net">USB_DP</text>
  <text x="1155" y="676" text-anchor="end" class="pin">GPIO21</text><line x1="1180" y1="671" x2="1270" y2="671" class="ctl"/><text x="1280" y="677" class="net">PSHOLD</text>
  <text x="1155" y="718" text-anchor="end" class="pin">GPIO47</text><line x1="1180" y1="713" x2="1270" y2="713" class="ctl"/><text x="1280" y="719" class="net">PGOOD</text>
  <text x="1155" y="760" text-anchor="end" class="pin">GPIO48</text><line x1="1180" y1="755" x2="1270" y2="755" class="ctl"/><text x="1280" y="761" class="net">LED_N</text>
  <text x="1155" y="802" text-anchor="end" class="pin">GPIO43/U0TXD</text><line x1="1180" y1="797" x2="1270" y2="797" class="sig"/><text x="1280" y="803" class="net">U0TX</text>
  <text x="1155" y="844" text-anchor="end" class="pin">GPIO44/U0RXD</text><line x1="1180" y1="839" x2="1270" y2="839" class="sig"/><text x="1280" y="845" class="net">U0RX</text>
  <text x="1155" y="886" text-anchor="end" class="pin">GND / EPAD</text><line x1="1180" y1="881" x2="1230" y2="881" class="gnd"/><text x="1240" y="887" class="small">整面地＋过孔</text>

  <!-- Power decoupling -->
  <rect x="70" y="145" width="440" height="175" rx="10" class="box"/>
  <text x="290" y="180" text-anchor="middle" class="label">3V3_MAIN 与复位</text>
  <text x="95" y="215" class="small">3V3入口：10µF＋0.1µF，紧靠模块电源脚</text>
  <text x="95" y="248" class="small">EN：10k上拉到3V3，1µF到GND</text>
  <text x="95" y="281" class="small">STM6601 RST开漏并接EN；另留EN测试点</text>
  <line x1="510" y1="210" x2="575" y2="210" class="pwr"/><line x1="575" y1="210" x2="575" y2="335" class="pwr"/>
  <line x1="510" y1="270" x2="530" y2="270" class="ctl"/><line x1="530" y1="270" x2="530" y2="377" class="ctl"/>

  <!-- Function buttons -->
  <rect x="65" y="355" width="410" height="260" rx="10" class="box"/>
  <text x="270" y="391" text-anchor="middle" class="label">侧按键</text>
  <text x="90" y="431" class="head">SW1 功能键1 / BOOT</text>
  <text x="90" y="460" class="small">GPIO0 ── 按键 ── GND；10k上拉3V3</text>
  <text x="90" y="494" class="head">SW2 功能键2 / 硬复位组合</text>
  <text x="90" y="523" class="small">GPIO1 → D_A → 公共按键节点 → GND</text>
  <text x="90" y="551" class="small">STM6601 SR → D_B → 同一公共节点</text>
  <text x="90" y="580" class="tiny">D_A/D_B：低漏电小信号二极管，两个电源域只向按键节点导通</text>
  <line x1="475" y1="445" x2="500" y2="445" class="ctl"/><line x1="500" y1="419" x2="500" y2="445" class="ctl"/>
  <line x1="475" y1="525" x2="500" y2="525" class="ctl"/><line x1="500" y1="461" x2="500" y2="525" class="ctl"/>

  <!-- signal labels on left -->
  <text x="490" y="551" text-anchor="end" class="net">BAT_ADC</text>
  <text x="490" y="593" text-anchor="end" class="net">BME_SDA</text>
  <text x="490" y="635" text-anchor="end" class="net">BME_SCL</text>
  <text x="490" y="677" text-anchor="end" class="net">EPD_BUSY</text>
  <text x="490" y="719" text-anchor="end" class="net">EPD_RST</text>
  <text x="490" y="761" text-anchor="end" class="net">EPD_DC</text>
  <text x="490" y="803" text-anchor="end" class="net">EPD_CS</text>
  <text x="490" y="845" text-anchor="end" class="net">EPD_MOSI</text>
  <text x="490" y="887" text-anchor="end" class="net">EPD_SCLK</text>

  <!-- Test pads -->
  <rect x="65" y="650" width="440" height="280" rx="10" class="box"/>
  <text x="285" y="686" text-anchor="middle" class="label">屏幕侧测试焊盘（无元件）</text>
  <text x="90" y="724" class="small">TP1 3V3_MAIN　TP2 GND　TP3 BAT　TP4 USB_5V</text>
  <text x="90" y="757" class="small">TP5 EN　TP6 GPIO0　TP7 U0TXD　TP8 U0RXD</text>
  <text x="90" y="790" class="small">TP9 GNSS_TX　TP10 GNSS_RX　TP11 GNSS_1PPS</text>
  <text x="90" y="823" class="small">TP12 EPD_BUSY　TP13 SCLK　TP14 MOSI　TP15 CS</text>
  <text x="90" y="856" class="small">建议2.0 mm圆形镀金测试点，中心距≥2.54 mm</text>
  <text x="90" y="889" class="small">保留原生USB恢复之外的UART/BOOT/EN兜底通道</text>

  <!-- reserved straps -->
  <rect x="1370" y="145" width="365" height="230" rx="10" class="note"/>
  <text x="1552" y="184" text-anchor="middle" class="label">启动脚注意</text>
  <text x="1395" y="224" class="small">GPIO0：功能键1兼BOOT，必须10k上拉。</text>
  <text x="1395" y="258" class="small">GPIO3、GPIO45、GPIO46：首版不使用。</text>
  <text x="1395" y="292" class="small">上电期间不要让外设拉动启动配置脚。</text>
  <text x="1395" y="326" class="small">GPIO48只控制低电流开机指示灯。</text>

  <!-- LED detail -->
  <rect x="1370" y="405" width="365" height="170" rx="10" class="box"/>
  <text x="1552" y="443" text-anchor="middle" class="label">开机灯</text>
  <text x="1395" y="481" class="small">3V3 ─ 4.7k ─ 绿色LED ─ GPIO48</text>
  <text x="1395" y="514" class="small">GPIO48再以100k上拉到3V3。</text>
  <text x="1395" y="547" class="small">低＝亮；高＝灭；复位时默认灭。</text>

  <!-- firmware behavior -->
  <rect x="1370" y="610" width="365" height="320" rx="10" class="note"/>
  <text x="1552" y="650" text-anchor="middle" class="label">按键固件逻辑</text>
  <text x="1395" y="693" class="small">电源键按住1.0～1.2s：启动并置PSHOLD。</text>
  <text x="1395" y="731" class="small">运行中长按约1.5s：EPD深睡后撤销PSHOLD。</text>
  <text x="1395" y="769" class="small">电源键＋功能键2约4.7s：STM6601硬复位。</text>
  <text x="1395" y="807" class="small">功能键1＋开机：进入ESP32 ROM USB下载。</text>
  <text x="1395" y="845" class="small">普通运行：绿灯常亮；低功耗等待：慢闪。</text>
  <text x="1395" y="883" class="small">关机前必须发送EPD Deep Sleep命令。</text>

  <text x="55" y="1065" class="tiny">说明：图中GPIO是已冻结的逻辑分配；立创EDA落图时请用ESP32-S3-MINI-1-N8官方符号的实际焊盘编号关联。</text>
</svg>
