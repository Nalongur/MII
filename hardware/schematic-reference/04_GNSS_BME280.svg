<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#172033}
      .title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#526078}.label{font-size:18px;font-weight:700}
      .small{font-size:15px}.tiny{font-size:13px}.pin{font-size:14px}.box{fill:#fff;stroke:#26364d;stroke-width:2}
      .ic{fill:#edf4ff;stroke:#305d9c;stroke-width:2.5}.rfbox{fill:#f8efff;stroke:#8a3ea1;stroke-width:2.5}
      .note{fill:#fff7df;stroke:#d69a26;stroke-width:2}.pwr{stroke:#d13b3b;stroke-width:3;fill:none}
      .sig{stroke:#2767b1;stroke-width:2.4;fill:none}.ctl{stroke:#16856b;stroke-width:2.4;fill:none}
      .rf{stroke:#8a2181;stroke-width:3;fill:none}.gnd{stroke:#222;stroke-width:2.2;fill:none}.dash{stroke-dasharray:8 6}
      .net{font-size:14px;font-weight:700;fill:#185899}.rftext{font-size:14px;font-weight:700;fill:#8a2181}
    </style>
  </defs>
  <rect width="1800" height="1120" fill="#fcfdff"/>
  <text x="55" y="58" class="title">04｜E108-GN07IS、无源天线与BME280</text>
  <text x="55" y="88" class="sub">GNSS断电不保留星历｜18×18×2 mm无源陶瓷天线｜BME模块双供电焊盘兼容</text>

  <!-- GNSS load switch -->
  <text x="70" y="205" class="net">3V3_MAIN</text><line x1="160" y1="200" x2="285" y2="200" class="pwr"/>
  <rect x="285" y="140" width="300" height="220" rx="12" class="ic"/>
  <text x="435" y="180" text-anchor="middle" class="label">U6 TPS22919DCKR</text>
  <text x="315" y="225" class="small">VIN ← 3V3_MAIN</text>
  <text x="315" y="260" class="small">EN ← GPIO15 GNSS_EN</text>
  <text x="315" y="295" class="small">QOD → VOUT（快速放电）</text>
  <text x="315" y="330" class="small">CIN/COUT 各1µF</text>
  <line x1="585" y1="200" x2="720" y2="200" class="pwr"/><text x="620" y="188" class="net">3V3_GNSS</text>
  <line x1="210" y1="275" x2="285" y2="275" class="ctl"/><text x="70" y="281" class="net">GPIO15 GNSS_EN</text>
  <rect x="190" y="300" width="75" height="28" class="box"/><text x="227" y="320" text-anchor="middle" class="tiny">100k</text><line x1="227" y1="275" x2="227" y2="300" class="ctl"/><line x1="227" y1="328" x2="227" y2="350" class="gnd"/><text x="242" y="352" class="tiny">GND</text>

  <!-- GNSS module -->
  <rect x="720" y="125" width="540" height="530" rx="14" class="ic"/>
  <text x="990" y="165" text-anchor="middle" class="label">U7 E108-GN07IS</text>
  <text x="990" y="190" text-anchor="middle" class="small">12.2×16×2.4 mm｜默认115200 bps</text>
  <line x1="720" y1="200" x2="780" y2="200" class="pwr"/><text x="790" y="205" class="pin">23 VCC</text>
  <text x="790" y="240" class="pin">24/10/12/13 GND</text><line x1="720" y1="235" x2="780" y2="235" class="gnd"/>
  <text x="790" y="280" class="pin">22 VBCKP：悬空（不保留星历）</text>
  <text x="790" y="320" class="pin">20 TXD → GPIO18（ESP_RX）</text>
  <text x="790" y="360" class="pin">21 RXD ← GPIO17（ESP_TX）</text>
  <text x="790" y="400" class="pin">3　1PPS → GPIO16</text>
  <text x="790" y="440" class="pin">8　RESET_N：悬空（内部上拉）</text>
  <text x="790" y="480" class="pin">9　VCC_RF：悬空（无源天线）</text>
  <text x="790" y="520" class="pin">11 RF_IN → 56pF → IPEX1</text>
  <text x="790" y="560" class="pin">1/2/4/5/6/7/14～19：NC</text>
  <text x="790" y="600" class="tiny">VCC旁：10µF＋0.1µF；所有GND焊盘就近过孔到L2地平面</text>
  <line x1="1260" y1="315" x2="1380" y2="315" class="sig"/><text x="1280" y="304" class="net">GNSS_TX</text>
  <line x1="1260" y1="355" x2="1380" y2="355" class="sig"/><text x="1280" y="344" class="net">GNSS_RX</text>
  <line x1="1260" y1="395" x2="1380" y2="395" class="sig"/><text x="1280" y="384" class="net">GNSS_1PPS</text>

  <!-- RF chain -->
  <line x1="1260" y1="515" x2="1340" y2="515" class="rf"/>
  <rect x="1340" y="493" width="100" height="44" class="box"/><text x="1390" y="512" text-anchor="middle" class="tiny">C34 56pF</text><text x="1390" y="530" text-anchor="middle" class="tiny">C0G/NP0</text>
  <line x1="1440" y1="515" x2="1510" y2="515" class="rf"/>
  <rect x="1510" y="465" width="220" height="100" rx="10" class="rfbox"/>
  <text x="1620" y="503" text-anchor="middle" class="label">J3 IPEX1 / U.FL</text>
  <text x="1620" y="532" text-anchor="middle" class="small">50Ω馈线，走线极短</text>
  <line x1="1620" y1="565" x2="1620" y2="610" class="rf"/>
  <rect x="1465" y="610" width="310" height="150" rx="12" class="rfbox"/>
  <text x="1620" y="650" text-anchor="middle" class="label">18×18×2 mm无源陶瓷天线</text>
  <text x="1620" y="682" text-anchor="middle" class="small">GPS L1 1575.42 / BDS B1 1561 MHz</text>
  <text x="1620" y="714" text-anchor="middle" class="small">IPEX1同轴线30～50 mm</text>
  <text x="1620" y="742" text-anchor="middle" class="tiny">白色陶瓷面朝塑料背板外侧</text>

  <!-- BME module -->
  <rect x="55" y="515" width="620" height="435" rx="14" class="ic"/>
  <text x="365" y="558" text-anchor="middle" class="label">U8 ZY-BME280模块（按实物焊盘命名）</text>
  <rect x="210" y="605" width="390" height="220" rx="10" class="box"/>
  <text x="235" y="645" class="pin">左侧：3.3V　GND　SDO　NC</text>
  <text x="235" y="685" class="pin">右侧：VCC　 GND　SCL　SDA</text>
  <text x="235" y="735" class="small">默认供电：3V3_MAIN → 0Ω → “3.3V”</text>
  <text x="235" y="770" class="small">备用供电：3V3_MAIN → 0Ω(DNP) → “VCC”</text>
  <text x="235" y="805" class="tiny">两个0Ω禁止同时安装，防止未知模块内部稳压路径互相短接</text>
  <line x1="55" y1="630" x2="210" y2="630" class="pwr"/><text x="70" y="618" class="net">3V3_MAIN</text>
  <line x1="55" y1="680" x2="210" y2="680" class="gnd"/><text x="70" y="671" class="small">GND</text>
  <line x1="600" y1="655" x2="675" y2="655" class="sig"/><text x="605" y="644" class="net">BME_SDA</text>
  <line x1="600" y1="695" x2="675" y2="695" class="sig"/><text x="605" y="684" class="net">BME_SCL</text>
  <text x="105" y="855" class="small">SDA、SCL各4.7k上拉到3V3_MAIN。</text>
  <text x="105" y="888" class="small">SDO默认0Ω接GND：地址0x76；预留改接3V3为0x77。</text>
  <text x="105" y="921" class="small">固件检查ID：BME280=0x60，BMP280=0x58。</text>

  <!-- layout notes -->
  <rect x="850" y="720" width="540" height="270" rx="12" class="note"/>
  <text x="1120" y="760" text-anchor="middle" class="label">布局约束</text>
  <text x="880" y="803" class="small">• GNSS天线与ESP32 Wi-Fi天线放在PCB相对两端。</text>
  <text x="880" y="839" class="small">• 天线下方及正前方禁止电池、金属背板、螺钉和大面积铜。</text>
  <text x="880" y="875" class="small">• RF_IN至IPEX按50Ω、连续地参考、少过孔，旁边布地过孔栅栏。</text>
  <text x="880" y="911" class="small">• BME放PCB边缘和外壳通气孔旁，离BQ/TPS/EPD电感≥20 mm。</text>
  <text x="880" y="947" class="small">• BME区域可用三面开槽形成热隔离舌片，避免板上热源影响温度。</text>

  <rect x="1440" y="800" width="335" height="190" rx="12" class="note"/>
  <text x="1607" y="840" text-anchor="middle" class="label">首版测试点</text>
  <text x="1470" y="880" class="small">TP_GNSS_3V3、TX、RX、1PPS</text>
  <text x="1470" y="915" class="small">TP_RF仅预留焊盘，不留长支路</text>
  <text x="1470" y="950" class="small">BME SDA/SCL各留小测试点</text>

  <text x="55" y="1065" class="tiny">E108引脚依据亿佰特官方定义：23=VCC，20=TXD，21=RXD，22=VBCKP，11=RF_IN，9=VCC_RF，3=1PPS。</text>
</svg>
