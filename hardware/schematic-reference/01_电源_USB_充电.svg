<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#172033}
      .title{font-size:34px;font-weight:700}.sub{font-size:18px;fill:#526078}.label{font-size:18px;font-weight:600}
      .small{font-size:15px}.tiny{font-size:13px}.note{font-size:16px;fill:#7a4a00}
      .box{fill:#fff;stroke:#26364d;stroke-width:2}.ic{fill:#edf4ff;stroke:#305d9c;stroke-width:2.5}
      .conn{fill:#f7f7fb;stroke:#6b7280;stroke-width:2}.pwr{stroke:#d13b3b;stroke-width:3;fill:none}
      .sig{stroke:#2767b1;stroke-width:2.4;fill:none}.ctl{stroke:#16856b;stroke-width:2.4;fill:none}
      .gnd{stroke:#222;stroke-width:2.2;fill:none}.dash{stroke-dasharray:8 6}.node{fill:#172033}
      .warn{fill:#fff7df;stroke:#d69a26;stroke-width:2}.ledr{fill:#e83535;stroke:#8d1111;stroke-width:2}
      .ledg{fill:#39a852;stroke:#176d2a;stroke-width:2}.net{font-size:15px;font-weight:700;fill:#b42c2c}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16856b"/></marker>
  </defs>
  <rect width="1800" height="1120" fill="#fcfdff"/>
  <text x="55" y="58" class="title">01｜USB-C、充电、电池与主电源</text>
  <text x="55" y="88" class="sub">0.6 mm 四层板｜单面贴片｜双线 1S LiPo 1200 mAh｜关机仍可充电</text>

  <!-- USB-C -->
  <rect x="55" y="160" width="210" height="310" rx="10" class="conn"/>
  <text x="160" y="195" text-anchor="middle" class="label">J1 USB-C</text>
  <text x="160" y="220" text-anchor="middle" class="small">TYPE-C-31-M-12 / C165948</text>
  <text x="245" y="270" text-anchor="end" class="small">VBUS</text>
  <text x="245" y="315" text-anchor="end" class="small">D+ A6/B6</text>
  <text x="245" y="350" text-anchor="end" class="small">D− A7/B7</text>
  <text x="245" y="395" text-anchor="end" class="small">CC1 / CC2</text>
  <text x="245" y="435" text-anchor="end" class="small">GND / SHIELD</text>
  <line x1="265" y1="265" x2="350" y2="265" class="pwr"/><text x="285" y="255" class="net">USB_5V</text>
  <line x1="265" y1="310" x2="350" y2="310" class="sig"/>
  <line x1="265" y1="345" x2="350" y2="345" class="sig"/>
  <line x1="265" y1="390" x2="315" y2="390" class="sig"/>
  <line x1="265" y1="430" x2="315" y2="430" class="gnd"/>

  <!-- CC resistors -->
  <rect x="315" y="374" width="78" height="30" class="box"/><text x="354" y="395" text-anchor="middle" class="tiny">2×5.1k</text>
  <line x1="393" y1="389" x2="430" y2="389" class="gnd"/><text x="438" y="395" class="small">GND</text>

  <!-- ESD -->
  <rect x="350" y="285" width="180" height="84" rx="7" class="ic"/>
  <text x="440" y="317" text-anchor="middle" class="label">U2 TPD4E05U06</text>
  <text x="440" y="343" text-anchor="middle" class="small">D+ / D− / CC1 / CC2 ESD</text>
  <line x1="530" y1="310" x2="650" y2="310" class="sig"/><text x="558" y="300" class="small">USB_DP</text>
  <line x1="530" y1="345" x2="650" y2="345" class="sig"/><text x="558" y="365" class="small">USB_DM</text>
  <rect x="650" y="296" width="62" height="28" class="box"/><text x="681" y="316" text-anchor="middle" class="tiny">22Ω</text>
  <rect x="650" y="331" width="62" height="28" class="box"/><text x="681" y="351" text-anchor="middle" class="tiny">22Ω</text>
  <line x1="712" y1="310" x2="790" y2="310" class="sig"/><text x="720" y="298" class="small">→ GPIO20 D+</text>
  <line x1="712" y1="345" x2="790" y2="345" class="sig"/><text x="720" y="370" class="small">→ GPIO19 D−</text>
  <rect x="360" y="225" width="160" height="45" rx="5" class="box"/><text x="440" y="253" text-anchor="middle" class="small">TVS：PESD5V0S1UL</text>
  <line x1="350" y1="265" x2="360" y2="248" class="pwr"/><line x1="520" y1="248" x2="545" y2="248" class="gnd"/><text x="550" y="253" class="small">GND</text>

  <!-- Charger -->
  <rect x="570" y="150" width="330" height="330" rx="12" class="ic"/>
  <text x="735" y="190" text-anchor="middle" class="label">U3 BQ24074RGTR</text>
  <text x="735" y="215" text-anchor="middle" class="small">1S LiPo PowerPath 4.2 V</text>
  <text x="590" y="265" class="small">IN</text><line x1="545" y1="265" x2="570" y2="265" class="pwr"/>
  <text x="590" y="300" class="small">EN1 = 1（接 OUT）</text>
  <text x="590" y="330" class="small">EN2 = 0（接 GND）</text>
  <text x="590" y="360" class="small">CE = 0（充电使能）</text>
  <text x="590" y="390" class="small">ISET → 2.21k → GND</text>
  <text x="590" y="420" class="small">ILIM → 1.5k → GND</text>
  <text x="590" y="450" class="small">TMR：悬空＝默认计时</text>
  <text x="815" y="265" class="small">OUT</text><line x1="900" y1="260" x2="1030" y2="260" class="pwr"/><text x="920" y="248" class="net">SYS_OUT</text>
  <text x="815" y="310" class="small">BAT</text><line x1="900" y1="305" x2="1030" y2="305" class="pwr"/><text x="925" y="296" class="net">BAT</text>
  <text x="815" y="350" class="small">CHG</text><line x1="900" y1="345" x2="1010" y2="345" class="ctl"/>
  <text x="815" y="390" class="small">PGOOD</text><line x1="900" y1="385" x2="1010" y2="385" class="ctl"/>
  <text x="815" y="430" class="small">TS</text><line x1="900" y1="425" x2="965" y2="425" class="sig"/>

  <!-- Battery -->
  <rect x="1350" y="135" width="370" height="140" rx="10" class="conn"/>
  <text x="1535" y="175" text-anchor="middle" class="label">BT1 1S LiPo</text>
  <text x="1535" y="207" text-anchor="middle" class="small">3×50×60 mm / 1200 mAh</text>
  <text x="1535" y="239" text-anchor="middle" class="small">红线 BAT＋｜黑线 GND</text>
  <line x1="1030" y1="305" x2="1280" y2="305" class="pwr"/><line x1="1280" y1="305" x2="1280" y2="205" class="pwr"/><line x1="1280" y1="205" x2="1350" y2="205" class="pwr"/>
  <line x1="1350" y1="255" x2="1310" y2="255" class="gnd"/><text x="1258" y="261" class="small">GND</text>
  <rect x="965" y="410" width="78" height="30" class="box"/><text x="1004" y="431" text-anchor="middle" class="tiny">10k</text>
  <line x1="1043" y1="425" x2="1073" y2="425" class="gnd"/><text x="1080" y="431" class="small">GND（TS 固定）</text>
  <text x="972" y="466" class="tiny">NTC 10k 0402 备用：DNP＋选择焊盘</text>

  <!-- Charge LED and readback -->
  <line x1="970" y1="260" x2="970" y2="195" class="pwr"/><rect x="960" y="176" width="90" height="28" class="box"/><text x="1005" y="196" text-anchor="middle" class="tiny">RLED 3.3k</text>
  <circle cx="1090" cy="190" r="14" class="ledr"/><text x="1115" y="196" class="small">红色充电灯</text>
  <line x1="1050" y1="190" x2="1076" y2="190" class="pwr"/><line x1="1090" y1="204" x2="1090" y2="345" class="ctl"/><line x1="1010" y1="345" x2="1090" y2="345" class="ctl"/>
  <path d="M1090 345 L1150 345 L1165 335 L1180 355 L1195 345 L1240 345" class="ctl"/>
  <text x="1145" y="325" class="tiny">D_CHG 隔离</text><text x="1248" y="351" class="small">GPIO13（100k 上拉 3V3）</text>
  <line x1="1010" y1="385" x2="1240" y2="385" class="ctl"/><text x="1248" y="391" class="small">GPIO47 PGOOD（10k 上拉 3V3）</text>

  <!-- STM6601 -->
  <rect x="100" y="610" width="360" height="360" rx="12" class="ic"/>
  <text x="280" y="650" text-anchor="middle" class="label">U4 STM6601BM2DDM6F</text>
  <text x="280" y="676" text-anchor="middle" class="small">长按开关机／硬件复位控制</text>
  <text x="125" y="730" class="small">VCC ← SYS_OUT；C=0.1µF</text>
  <text x="125" y="762" class="small">VREF → 1µF → GND（必须）</text>
  <text x="125" y="794" class="small">PB ← 电源键 → GND</text>
  <text x="125" y="826" class="small">SR ← 功能键2隔离二极管</text>
  <text x="125" y="858" class="small">CSRD → 470nF → GND（约4.7s）</text>
  <text x="125" y="890" class="small">PSHOLD ← GPIO21</text>
  <text x="125" y="922" class="small">PBOUT → GPIO2；INT → GPIO14</text>
  <text x="125" y="954" class="small">RST（开漏）→ ESP32 EN</text>
  <line x1="280" y1="610" x2="280" y2="555" class="pwr"/><text x="210" y="545" class="net">SYS_OUT</text>
  <line x1="460" y1="730" x2="540" y2="730" class="ctl"/><text x="470" y="718" class="small">/EN（低＝开机）</text>

  <!-- inverter -->
  <rect x="540" y="675" width="240" height="145" rx="8" class="box"/>
  <text x="660" y="708" text-anchor="middle" class="label">Q2 EN反相</text>
  <text x="660" y="738" text-anchor="middle" class="small">MMBT3904</text>
  <text x="660" y="765" text-anchor="middle" class="tiny">B：/EN 经100k</text>
  <text x="660" y="790" text-anchor="middle" class="tiny">C：TPS_EN；E：GND</text>
  <line x1="780" y1="730" x2="860" y2="730" class="ctl"/><text x="795" y="718" class="small">TPS_EN</text>
  <line x1="820" y1="730" x2="820" y2="655" class="pwr"/><rect x="790" y="625" width="75" height="28" class="box"/><text x="827" y="645" text-anchor="middle" class="tiny">100k</text><line x1="827" y1="625" x2="827" y2="590" class="pwr"/><text x="845" y="595" class="net">SYS_OUT</text>

  <!-- TPS63021 -->
  <rect x="860" y="600" width="430" height="340" rx="12" class="ic"/>
  <text x="1075" y="642" text-anchor="middle" class="label">U5 TPS63021DSJR（固定3.3V）</text>
  <text x="885" y="700" class="small">VIN / VINA ← SYS_OUT</text>
  <text x="885" y="735" class="small">CIN：2×10µF＋0.1µF</text>
  <text x="885" y="770" class="small">L1↔L2：1.5µH SPM4020</text>
  <text x="885" y="805" class="small">EN ← TPS_EN</text>
  <text x="885" y="840" class="small">PS/SYNC → GND（省电模式）</text>
  <text x="885" y="875" class="small">FB → VOUT</text>
  <text x="885" y="910" class="small">COUT：3×22µF</text>
  <line x1="1075" y1="600" x2="1075" y2="550" class="pwr"/><text x="1005" y="540" class="net">SYS_OUT</text>
  <line x1="1290" y1="720" x2="1445" y2="720" class="pwr"/><text x="1325" y="707" class="net">3V3_MAIN</text>
  <rect x="1450" y="665" width="275" height="120" rx="8" class="conn"/>
  <text x="1588" y="702" text-anchor="middle" class="label">整机3.3 V</text>
  <text x="1588" y="733" text-anchor="middle" class="small">ESP32 / EPD / BME</text>
  <text x="1588" y="760" text-anchor="middle" class="small">GNSS经独立负载开关</text>

  <!-- Battery ADC -->
  <line x1="1125" y1="305" x2="1125" y2="520" class="pwr"/>
  <rect x="1090" y="492" width="70" height="30" class="box"/><text x="1125" y="513" text-anchor="middle" class="tiny">1M</text>
  <circle cx="1125" cy="545" r="5" class="node"/>
  <line x1="1125" y1="545" x2="1250" y2="545" class="sig"/><text x="1260" y="551" class="small">GPIO4 BAT_ADC（100nF→GND）</text>
  <rect x="1090" y="565" width="70" height="30" class="box"/><text x="1125" y="586" text-anchor="middle" class="tiny">330k</text>
  <line x1="1125" y1="595" x2="1125" y2="620" class="gnd"/><text x="1140" y="620" class="small">GND</text>

  <!-- Power LED -->
  <line x1="1290" y1="720" x2="1360" y2="720" class="pwr"/><line x1="1360" y1="720" x2="1360" y2="770" class="pwr"/><rect x="1320" y="770" width="80" height="28" class="box"/><text x="1360" y="790" text-anchor="middle" class="tiny">4.7k</text>
  <circle cx="1360" cy="830" r="14" class="ledg"/><text x="1385" y="836" class="small">绿色开机灯</text>
  <line x1="1360" y1="844" x2="1360" y2="870" class="ctl"/><text x="1385" y="869" class="small">GPIO48（低＝亮，100k上拉）</text>

  <rect x="1330" y="895" width="410" height="125" rx="8" class="warn"/>
  <text x="1350" y="925" class="note">布板重点</text>
  <text x="1350" y="955" class="small">• BQ/TPS及电感远离GNSS天线和BME280。</text>
  <text x="1350" y="982" class="small">• 裸焊盘打热过孔；电池区无元件，焊线做应力释放。</text>

  <text x="55" y="1080" class="tiny">参考图 v0.2｜网络名优先于图形距离｜投板前必须按所购器件最新版数据手册复核封装与引脚</text>
</svg>
